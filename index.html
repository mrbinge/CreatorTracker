<style>
  :root{
    --bg: #14161a;
    --card: #1b1e23;
    --card-hover: #21252b;
    --border: #2a2e35;
    --ink: #5b9bd9;
    --ink-dim: #3d6a94;
    --sage: #5b9bd9;
    --sage-dim: #2c3f52;
    --danger: #b5524a;
    --text: #e6e8ec;
    --text-dim: #9aa1ab;
    --text-faint: #565c66;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --mono: ui-monospace, 'SF Mono', Consolas, 'Courier New', monospace;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    background:
      radial-gradient(ellipse 800px 500px at 50% -10%, rgba(91,155,217,0.08), transparent),
      var(--bg);
    color: var(--text);
    font-family: var(--serif);
    min-height:100vh;
    padding: 32px 18px 80px;
    display:flex;
    justify-content:center;
  }

  .container{ max-width: 760px; width:100%; }

  /* HEADER */
  .header{
    text-align:center;
    margin-bottom: 36px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--border);
  }
  .header h1{
    font-size: 2.1rem;
    font-weight: 400;
    letter-spacing: 1px;
    color:#fff;
  }
  .header h1 .quill{ color: var(--ink); }
  .header .sub{
    margin-top: 8px;
    font-size: 0.95rem;
    color: var(--text-dim);
    font-style: italic;
  }

  /* STATS */
  .stats{
    display:flex;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 20px;
    overflow:hidden;
  }
  .stat{
    flex:1;
    text-align:center;
    padding: 16px 8px;
    border-right: 1px solid var(--border);
    border-top:none; border-bottom:none; border-left:none;
    background:none;
    cursor:pointer;
    font-family: inherit;
    transition: background .15s;
  }
  .stat:last-child{ border-right:none; }
  .stat:hover{ background: rgba(255,255,255,0.04); }
  .stat.active{ background: rgba(91,155,217,0.12); box-shadow: inset 0 -2px 0 var(--ink); }
  .stat.active .n{ color: var(--ink); }
  .stat .n{
    font-family: var(--mono);
    font-size: 1.5rem;
    font-weight: 600;
    color:#fff;
  }
  .stat .l{
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 3px;
  }

  /* SETTINGS */
  .header{ position:relative; }
  .settings-gear{
    position:absolute;
    top: -4px; right: 0;
    background:none; border:none;
    color: var(--text-faint);
    font-size: 1.25rem;
    cursor:pointer;
    padding: 6px 8px;
    border-radius: 8px;
    transition: background .15s, color .15s;
  }
  .settings-gear:hover{ background: rgba(255,255,255,0.06); color:#fff; }

  .modal-overlay{
    display:none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    align-items:center; justify-content:center;
    z-index: 50;
    padding: 20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-panel{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    width:100%;
    max-width: 340px;
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 16px;
    font-family: var(--mono);
    font-size: 0.78rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .modal-close{
    background:none; border:none; cursor:pointer;
    color: var(--text-faint);
    font-size: 1rem;
    padding: 2px 6px;
    border-radius: 6px;
    transition: background .15s, color .15s;
  }
  .modal-close:hover{ background: rgba(255,255,255,0.06); color:#fff; }
  .modal-section-title{
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .modal-row{
    display:flex;
    flex-direction:column;
    gap: 10px;
  }
  .settings-action{
    display:flex; align-items:center; gap:8px;
    width:100%;
    background: var(--bg);
    border:1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.8rem;
    cursor:pointer;
    transition: background .15s, border-color .15s;
  }
  .settings-action:hover{ border-color: var(--ink-dim); background: rgba(91,155,217,0.08); }
  .settings-action.danger{ border-color: rgba(181,82,74,0.4); color: #fff; background: rgba(181,82,74,0.12); }
  .settings-action.danger:hover{ background: rgba(181,82,74,0.22); border-color: var(--danger); }

  .confirm-message{
    font-size: 0.92rem;
    color: var(--text);
    line-height: 1.5;
    margin-bottom: 18px;
  }
  .confirm-actions{
    display:flex;
    flex-direction: row;
    gap: 10px;
  }
  .confirm-actions .settings-action{ flex:1; justify-content:center; text-align:center; }

  .color-edit-row{
    display:flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
  }

  /* ADD PROJECT */
  .add-project{
    background: var(--card);
    border:1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 26px;
  }
  .add-row{
    display:flex;
    gap:10px;
    flex-wrap: wrap;
  }
  .add-row input[type="text"]{
    flex:1;
    min-width: 200px;
    padding: 12px 14px;
    background: var(--bg);
    border:1px solid var(--border);
    border-radius: 8px;
    color:#fff;
    font-family: var(--serif);
    font-size: 1rem;
    outline:none;
  }
  .add-row input[type="text"]:focus{ border-color: var(--ink-dim); }

  .colors{ display:flex; gap:7px; align-items:center; flex-wrap: wrap; max-width: 220px; }
  .color-dot{
    width:22px; height:22px; border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    flex-shrink:0;
    transition: transform .15s;
  }
  .color-dot:hover{ transform: scale(1.15); }
  .color-dot.active{ border-color:#fff; box-shadow:0 0 6px rgba(255,255,255,.35); }
  .color-dot.gear{
    background: var(--bg);
    border: 1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    padding:0;
    font-size: 0.8rem;
    color: var(--text-faint);
    line-height:1;
  }
  .color-dot.gear:hover{ color:#fff; border-color: var(--ink-dim); transform: scale(1.1); }

  .quick-colors-hint{
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .quick-colors-grid{
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .quick-colors-grid .color-dot{ width:26px; height:26px; }

  .btn{
    font-family: var(--mono);
    font-size: 0.85rem;
    border:none;
    border-radius: 8px;
    cursor:pointer;
    padding: 12px 22px;
    background: var(--ink-dim);
    color:#fff;
    transition: background .15s, transform .1s;
    white-space:nowrap;
  }
  .btn:hover{ background: var(--ink); }
  .btn:active{ transform: scale(.96); }

  /* PROJECT CARD */
  .projects{ display:flex; flex-direction:column; gap:10px; margin-bottom: 8px; }

  .project{
    background: #17191d;
    border-radius: 8px;
    border-left: 4px solid var(--border);
    padding: 14px 18px;
    animation: rise .25s ease;
  }
  .project.dragging{ opacity: 0.35; }
  .project.drag-over{ box-shadow: inset 0 2px 0 var(--ink); }
  @keyframes rise{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }

  .project-body{ min-width:0; }

  .project-top{
    display:flex;
    align-items:center;
    gap: 10px;
    cursor:pointer;
  }
  .project-top.drag-handle{ cursor: grab; }
  .project-title{
    flex:1;
    font-size: 1.08rem;
    color:#fff;
    word-break: break-word;
  }
  .project-title.done{ text-decoration: line-through; color: var(--text-dim); }

  .progress-tag{
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text-dim);
    white-space:nowrap;
  }

  .chevron{
    color: var(--text-faint);
    font-size: 0.8rem;
    transition: transform .2s;
    flex-shrink:0;
  }
  .chevron.open{ transform: rotate(90deg); }

  .project-actions{ display:flex; gap:2px; flex-shrink:0; }
  .icon-btn{
    background:none; border:none; cursor:pointer;
    color: var(--text-faint);
    font-size: 1.05rem;
    padding: 4px 7px;
    border-radius:6px;
    transition: background .15s, color .15s;
    line-height:1;
  }
  .icon-btn:hover{ background: rgba(255,255,255,0.06); color:#fff; }
  .icon-btn.danger:hover{ color: var(--danger); }
  .icon-btn.finish:hover{ color: var(--sage); }
  .icon-btn.restore:hover{ color: var(--ink); }

  .edit-btn{
    background:none; border:none; cursor:pointer;
    color: var(--text-faint);
    font-size: 0.85rem;
    padding: 4px 7px;
    border-radius: 6px;
    transition: background .15s, color .15s;
    flex-shrink:0;
  }
  .edit-btn:hover{ background: rgba(255,255,255,0.06); color:#fff; }

  .subtask-edit{
    background:none; border:none; cursor:pointer;
    color: var(--text-faint);
    font-size: 0.85rem;
    opacity: 0;
    transition: opacity .15s, color .15s;
    flex-shrink:0;
  }
  .subtask:hover .subtask-edit{ opacity: 1; }
  .subtask-edit:hover{ color:#fff; }

  .inline-edit-input{
    flex:1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--ink-dim);
    border-radius: 6px;
    padding: 4px 8px;
    color:#fff;
    font-family: var(--serif);
    font-size: inherit;
    outline:none;
  }

  .progress-bar{
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 10px;
    overflow:hidden;
  }
  .progress-bar-fill{
    height:100%;
    background: var(--spine-color, var(--ink));
    transition: width .35s ease;
  }

  /* SUBTASKS (steps within a section) */
  .subtasks{
    display:flex;
    flex-direction:column;
    gap: 4px;
    margin-top: 4px;
  }

  .subtask{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 6px 4px;
    border-radius: 6px;
    cursor: grab;
  }
  .subtask:hover{ background: rgba(255,255,255,0.03); }
  .subtask.dragging{ opacity: 0.35; }
  .subtask.drag-over{ box-shadow: inset 0 2px 0 var(--ink); }

  .subtask-check{
    width: 18px; height:18px;
    border-radius: 4px;
    border: 1.5px solid var(--text-faint);
    flex-shrink:0;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size: 0.7rem;
    color: transparent;
    transition: all .15s;
  }
  .subtask-check.checked{
    background: var(--sage-dim);
    border-color: var(--sage);
    color: var(--sage);
  }

  .subtask-num{
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text-faint);
    width: 18px;
    text-align:right;
    flex-shrink:0;
  }

  .subtask-text{
    flex:1;
    font-size: 0.92rem;
    color: var(--text);
    word-break: break-word;
  }
  .subtask-text.done{ color: var(--text-faint); text-decoration: line-through; }

  .subtask-del{
    background:none; border:none; cursor:pointer;
    color: var(--text-faint);
    font-size: 0.9rem;
    opacity: 0;
    transition: opacity .15s, color .15s;
    flex-shrink:0;
  }
  .subtask:hover .subtask-del{ opacity: 1; }
  .subtask-del:hover{ color: var(--danger); }

  .add-subtask{
    display:flex;
    gap: 8px;
    margin-top: 6px;
    padding-left: 26px;
  }
  .add-subtask input{
    flex:1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    color:#fff;
    font-family: var(--serif);
    font-size: 0.88rem;
    outline:none;
  }
  .add-subtask input:focus{ border-color: var(--ink-dim); }
  .add-subtask button{
    background: var(--border);
    border:none;
    border-radius: 6px;
    color: var(--text);
    padding: 7px 12px;
    font-family: var(--mono);
    font-size: 0.76rem;
    cursor:pointer;
  }
  .add-subtask button:hover{ background: var(--ink-dim); color:#fff; }

  /* SECTIONS (parts of a project) */
  .sections-wrap{
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
    display:none;
    flex-direction:column;
    gap: 16px;
  }
  .sections-wrap.open{ display:flex; }

  .section-block{
    display:flex;
    flex-direction:column;
    gap: 2px;
  }
  .section-block.drag-over .section-head{ box-shadow: inset 0 2px 0 var(--ink); }

  .section-head{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 2px 2px 4px;
    cursor: grab;
  }
  .section-head.dragging{ opacity: 0.35; }

  .section-marker{
    width: 6px; height:6px; border-radius:50%;
    background: var(--ink-dim);
    flex-shrink:0;
  }
  .section-title{
    flex:1;
    font-size: 0.95rem;
    color: #fff;
    font-weight: 600;
    letter-spacing: 0.2px;
    word-break: break-word;
  }
  .section-progress{
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text-dim);
    white-space:nowrap;
  }
  .section-del{
    background:none; border:none; cursor:pointer;
    color: var(--text-faint);
    font-size: 0.9rem;
    padding: 2px 6px;
    border-radius: 6px;
    flex-shrink:0;
  }
  .section-del:hover{ background: rgba(255,255,255,0.06); color: var(--danger); }

  .section-empty{
    padding: 4px 4px 4px 26px;
    font-size: 0.85rem;
    color: var(--text-faint);
    font-style: italic;
  }

  .add-section{
    display:flex;
    gap: 8px;
    margin-top: 2px;
  }
  .add-section input{
    flex:1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 12px;
    color:#fff;
    font-family: var(--serif);
    font-size: 0.92rem;
    outline:none;
  }
  .add-section input:focus{ border-color: var(--ink-dim); }
  .add-section button{
    background: var(--ink-dim);
    border:none;
    border-radius: 6px;
    color:#fff;
    padding: 9px 16px;
    font-family: var(--mono);
    font-size: 0.78rem;
    cursor:pointer;
    white-space:nowrap;
  }
  .add-section button:hover{ background: var(--ink); }

  .sections-empty{
    padding: 6px 2px 12px;
    font-size: 0.9rem;
    color: var(--text-faint);
    font-style: italic;
  }

  .notes-block{ margin-bottom: 4px; }
  .notes-label{
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 6px;
  }
  .notes-textarea{
    width:100%;
    min-height: 68px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: var(--serif);
    font-size: 0.9rem;
    line-height: 1.5;
    resize: vertical;
    outline:none;
  }
  .notes-textarea:focus{ border-color: var(--ink-dim); }
  .notes-textarea::placeholder{ color: var(--text-faint); }

  /* TODAY VIEW */
  .today-item{
    display:flex;
    align-items:flex-start;
    gap: 12px;
    background: #17191d;
    border-radius: 8px;
    border-left: 4px solid var(--border);
    padding: 13px 16px;
    animation: rise .25s ease;
  }
  .today-item .subtask-check{ margin-top: 2px; }
  .today-item-body{ flex:1; min-width:0; }
  .today-item-title{
    font-size: 0.95rem;
    color: var(--text);
    word-break: break-word;
  }
  .today-item-sub{
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text-faint);
    margin-top: 5px;
    word-break: break-word;
  }
  .today-note{
    font-size: 0.88rem;
    color: var(--text-faint);
    font-style: italic;
    flex:1;
  }
  .today-action-btn{
    background:none;
    border:1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 0.72rem;
    padding: 7px 11px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
    transition: border-color .15s, color .15s;
  }
  .today-action-btn:hover{ border-color: var(--ink-dim); color:#fff; }

  .empty-state{
    text-align:center;
    color: var(--text-faint);
    font-style: italic;
    padding: 36px 10px;
  }

  .view-label{
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 12px;
  }

  /* STEPS VIEW */
  .steps-group{ margin-bottom: 6px; }
  .steps-group-title{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 8px 4px 4px;
    font-size: 0.9rem;
    color: var(--text-dim);
  }
  .steps-group-title .sub{
    color: var(--text-faint);
    font-size: 0.8rem;
  }
  .steps-group-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  /* ARCHIVE */
  .archive-item{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 11px 16px;
    background: #17191d;
    border-radius: 8px;
    border-left: 4px solid var(--border);
  }
  .archive-item .title{
    flex:1;
    color: var(--text-faint);
    text-decoration: line-through;
    font-size: 0.92rem;
  }
  .archive-item .meta{
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text-faint);
    white-space:nowrap;
  }
  .archive-item .icon-btn{ flex-shrink:0; }

  .clear-archive{ text-align:right; margin-top: 10px; }
  .clear-archive button{
    background:none; border:none;
    color: var(--text-faint);
    font-family: var(--mono);
    font-size: 0.72rem;
    cursor:pointer;
    padding: 4px 10px;
  }
  .clear-archive button:hover{ color: var(--danger); }

  @media (max-width: 560px){
    .add-row{ flex-direction:column; align-items:stretch; }
    .colors{ justify-content:center; }
    .stat .n{ font-size: 1.2rem; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <button class="settings-gear" id="settingsBtn" title="Настройки">⚙</button>
    <h1><span class="quill">✒</span> Трекер Творца</h1>
    <div class="sub">Большая задача — это просто много маленьких шагов</div>
  </div>

  <div class="stats">
    <button class="stat active" data-view="today"><div class="n" id="statToday">0</div><div class="l">На сегодня</div></button>
    <button class="stat" data-view="active"><div class="n" id="statProjects">0</div><div class="l">Проектов</div></button>
    <button class="stat" data-view="steps"><div class="n" id="statSteps">0</div><div class="l">Шагов сделано</div></button>
    <button class="stat" data-view="archive"><div class="n" id="statDone">0</div><div class="l">Завершено</div></button>
  </div>

  <div class="add-project" id="addProjectSection">
    <div class="add-row">
      <input type="text" id="projectInput" placeholder="Например: Написать первую главу" maxlength="140">
      <div class="colors" id="colorPicker"></div>
      <button class="btn" id="addProjectBtn">+ Новая задача</button>
    </div>
  </div>

  <div class="view-label" id="viewLabel">В планах</div>
  <div class="projects" id="mainList"></div>
  <div class="clear-archive" id="clearArchiveWrap" style="display:none;"><button id="clearArchiveBtn">Очистить архив</button></div>

</div>

<div class="modal-overlay" id="settingsOverlay">
  <div class="modal-panel">
    <div class="modal-head">
      <span>Настройки</span>
      <button class="modal-close" id="settingsClose">✕</button>
    </div>
    <div class="modal-section-title">Данные</div>
    <div class="modal-row">
      <button class="settings-action" id="exportBtn">⭳ Скачать бэкап</button>
      <button class="settings-action" id="importBtn">⭱ Загрузить бэкап</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>
</div>

<div class="modal-overlay" id="confirmOverlay">
  <div class="modal-panel">
    <div class="confirm-message" id="confirmMessage"></div>
    <div class="confirm-actions">
      <button class="settings-action" id="confirmCancelBtn">Отмена</button>
      <button class="settings-action danger" id="confirmOkBtn">Удалить</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="quickColorsOverlay">
  <div class="modal-panel">
    <div class="modal-head">
      <span>Быстрые цвета</span>
      <button class="modal-close" id="quickColorsClose">✕</button>
    </div>
    <div class="quick-colors-hint">Выбери до 5 цветов — они появятся в строке создания задачи. При выборе шестого самый старый уступает место.</div>
    <div class="quick-colors-grid" id="quickColorsGrid"></div>
  </div>
</div>

<script>
(function(){
"use strict";

const COLORS = ['#4a90e2','#29b6f6','#26c6da','#26a69a','#66bb6a','#9ccc65','#d4e157','#ffca28','#ffa726','#ff7043','#ef5350','#ec407a','#ab47bc','#7e57c2','#5c6bc0','#8d6e63'];

const els = {
  projectInput: document.getElementById('projectInput'),
  addProjectBtn: document.getElementById('addProjectBtn'),
  colorPicker: document.getElementById('colorPicker'),
  mainList: document.getElementById('mainList'),
  viewLabel: document.getElementById('viewLabel'),
  addProjectSection: document.getElementById('addProjectSection'),
  clearArchiveWrap: document.getElementById('clearArchiveWrap'),
  clearArchiveBtn: document.getElementById('clearArchiveBtn'),
  statProjects: document.getElementById('statProjects'),
  statSteps: document.getElementById('statSteps'),
  statDone: document.getElementById('statDone'),
  statToday: document.getElementById('statToday'),
  statButtons: document.querySelectorAll('.stat'),
  exportBtn: document.getElementById('exportBtn'),
  importBtn: document.getElementById('importBtn'),
  importFile: document.getElementById('importFile'),
  settingsBtn: document.getElementById('settingsBtn'),
  settingsOverlay: document.getElementById('settingsOverlay'),
  settingsClose: document.getElementById('settingsClose'),
  confirmOverlay: document.getElementById('confirmOverlay'),
  confirmMessage: document.getElementById('confirmMessage'),
  confirmOkBtn: document.getElementById('confirmOkBtn'),
  confirmCancelBtn: document.getElementById('confirmCancelBtn'),
  quickColorsOverlay: document.getElementById('quickColorsOverlay'),
  quickColorsClose: document.getElementById('quickColorsClose'),
  quickColorsGrid: document.getElementById('quickColorsGrid'),
};

let selectedColor = COLORS[0];
let favoriteColors = [];

// --- unified data model ---
// item: { id, title, color, status: 'active'|'done', doneDate?,
//         sections: [ { id, title, subtasks: [ {id, text, done} ] } ] }
let items = [];

let openIds = new Set();
let currentView = 'active'; // 'active' | 'steps' | 'archive'
let dragInfo = null; // { kind: 'step'|'section'|'project', projectId, sectionId?, fromIndex }
let editingTarget = null; // { type: 'project'|'section'|'subtask', projectId, sectionId?, id }

const VIEW_LABELS = {
  today: 'Сегодня — по одному шагу',
  active: 'В планах',
  steps: 'Уже сделано (по шагам)',
  archive: 'Полностью завершено'
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// Custom in-app confirm/alert modal — replaces window.confirm()/alert(), which
// browsers may block or silently no-op inside sandboxed preview iframes,
// making buttons that relied on them look broken.
let confirmResolve = null;
function openConfirmModal(message, okLabel, showCancel){
  return new Promise((resolve) => {
    els.confirmMessage.textContent = message;
    els.confirmOkBtn.textContent = okLabel;
    els.confirmCancelBtn.style.display = showCancel ? '' : 'none';
    confirmResolve = resolve;
    els.confirmOverlay.classList.add('open');
  });
}
function resolveConfirm(value){
  els.confirmOverlay.classList.remove('open');
  if(confirmResolve){ confirmResolve(value); confirmResolve = null; }
}
function showConfirm(message, okLabel){ return openConfirmModal(message, okLabel || 'Удалить', true); }
function showAlert(message){ return openConfirmModal(message, 'Ок', false); }

function normalizeItem(raw, fallbackStatus){
  const it = Object.assign({}, raw);
  if(!it.id) it.id = uid();
  if(Array.isArray(it.sections)){
    it.sections = it.sections.map(s => ({
      id: s.id || uid(),
      title: s.title || 'Раздел',
      subtasks: (Array.isArray(s.subtasks) ? s.subtasks : []).map(t => ({
        id: t.id || uid(),
        text: t.text || '',
        done: !!t.done
      }))
    }));
  } else {
    const old = Array.isArray(it.subtasks) ? it.subtasks : [];
    it.sections = old.length ? [{
      id: uid(),
      title: 'Общее',
      subtasks: old.map(t => ({ id: t.id || uid(), text: t.text || '', done: !!t.done }))
    }] : [];
  }
  delete it.subtasks;
  delete it.subtasksTotal;
  delete it.subtasksDone;
  if(!it.status) it.status = fallbackStatus;
  if(!it.color) it.color = COLORS[0];
  if(typeof it.notes !== 'string') it.notes = '';
  return it;
}

function load(){
  try {
    const raw = JSON.parse(localStorage.getItem('wt_items'));
    if(Array.isArray(raw)){
      items = raw.map(r => normalizeItem(r, 'active'));
      return;
    }
  } catch(e){ /* fall through to legacy migration */ }

  // one-time migration from the old two-key (projects/archive) format
  let oldProjects = [], oldArchive = [];
  try { oldProjects = JSON.parse(localStorage.getItem('wt_projects')) || []; } catch(e){}
  try { oldArchive = JSON.parse(localStorage.getItem('wt_archive')) || []; } catch(e){}
  items = oldProjects.map(r => normalizeItem(r, 'active'))
    .concat(oldArchive.map(r => normalizeItem(r, 'done')));
  save();
  try { localStorage.removeItem('wt_projects'); localStorage.removeItem('wt_archive'); } catch(e){}
}

function save(){
  localStorage.setItem('wt_items', JSON.stringify(items));
}

function allSteps(it){
  return it.sections.reduce((acc, s) => acc.concat(s.subtasks), []);
}
function progressOf(it){
  const steps = allSteps(it);
  if(!steps.length) return 0;
  const done = steps.filter(s=>s.done).length;
  return Math.round((done / steps.length) * 100);
}
function sectionProgress(s){
  if(!s.subtasks.length) return { done: 0, total: 0 };
  return { done: s.subtasks.filter(x=>x.done).length, total: s.subtasks.length };
}

function loadFavoriteColors(){
  try {
    const raw = JSON.parse(localStorage.getItem('wt_fav_colors'));
    if(Array.isArray(raw)){
      favoriteColors = raw.filter(c => COLORS.includes(c));
    }
  } catch(e){ /* ignore */ }
  if(!favoriteColors.length) favoriteColors = COLORS.slice(0, 5);
}
function saveFavoriteColors(){
  localStorage.setItem('wt_fav_colors', JSON.stringify(favoriteColors));
}

function toggleFavoriteColor(c){
  const idx = favoriteColors.indexOf(c);
  if(idx !== -1){
    if(favoriteColors.length > 1) favoriteColors.splice(idx, 1);
  } else {
    favoriteColors.push(c);
    if(favoriteColors.length > 5) favoriteColors.shift();
  }
  saveFavoriteColors();
  if(!favoriteColors.includes(selectedColor)) selectedColor = favoriteColors[0];
  initColorPicker();
  renderQuickColorsGrid();
}

function openQuickColors(){
  renderQuickColorsGrid();
  els.quickColorsOverlay.classList.add('open');
}
function closeQuickColors(){ els.quickColorsOverlay.classList.remove('open'); }

function renderQuickColorsGrid(){
  els.quickColorsGrid.innerHTML = '';
  COLORS.forEach(c => {
    const dot = document.createElement('span');
    const isFav = favoriteColors.includes(c);
    dot.className = 'color-dot' + (isFav ? ' active' : '');
    dot.style.backgroundColor = c;
    dot.title = isFav ? 'В быстром доступе — нажми, чтобы убрать' : 'Добавить в быстрый доступ';
    dot.addEventListener('click', () => toggleFavoriteColor(c));
    els.quickColorsGrid.appendChild(dot);
  });
}

function initColorPicker(){
  els.colorPicker.innerHTML = '';
  favoriteColors.forEach(c => {
    const dot = document.createElement('span');
    dot.className = 'color-dot' + (c === selectedColor ? ' active' : '');
    dot.style.backgroundColor = c;
    dot.addEventListener('click', () => {
      selectedColor = c;
      els.colorPicker.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
      dot.classList.add('active');
    });
    els.colorPicker.appendChild(dot);
  });
  const gear = document.createElement('button');
  gear.type = 'button';
  gear.className = 'color-dot gear';
  gear.title = 'Настроить быстрые цвета';
  gear.innerHTML = '⚙';
  gear.addEventListener('click', openQuickColors);
  els.colorPicker.appendChild(gear);
}

function addProject(){
  const text = els.projectInput.value.trim();
  if(!text){ els.projectInput.focus(); return; }
  const it = { id: uid(), title: text, color: selectedColor, status: 'active', notes: '', sections: [] };
  items.unshift(it);
  els.projectInput.value = '';
  openIds.add(it.id);
  save(); render();
  els.projectInput.focus();
}

function deleteProject(id){
  items = items.filter(i => i.id !== id);
  openIds.delete(id);
  save(); render();
}

function deleteArchiveItem(id){
  const it = items.find(i => i.id === id);
  if(!it) return;
  showConfirm('Удалить «' + it.title + '» из архива без возможности восстановления?', 'Удалить').then(ok => {
    if(!ok) return;
    items = items.filter(i => i.id !== id);
    save(); render();
  });
}

function finishProject(id){
  const it = items.find(i => i.id === id);
  if(!it) return;
  it.status = 'done';
  it.doneDate = new Date().toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'});
  save(); render();
}

function restoreProject(id){
  const it = items.find(i => i.id === id);
  if(!it) return;
  it.status = 'active';
  delete it.doneDate;
  save();
  setView('active');
}

function startEdit(target){ editingTarget = target; render(); }
function cancelEdit(){ editingTarget = null; render(); }

function renameProject(id, newTitle){
  const it = items.find(i => i.id === id);
  if(it && newTitle.trim()) it.title = newTitle.trim();
  editingTarget = null;
  save(); render();
}

function setProjectColor(id, color){
  const it = items.find(i => i.id === id);
  if(!it) return;
  it.color = color;
  save(); render();
}

function updateNotes(id, text){
  const it = items.find(i => i.id === id);
  if(!it) return;
  it.notes = text;
  save(); // no render() here — would rebuild the textarea and lose cursor/focus mid-typing
}

function renameSection(projectId, sectionId, newTitle){
  const it = items.find(i => i.id === projectId);
  const s = it && it.sections.find(s => s.id === sectionId);
  if(s && newTitle.trim()) s.title = newTitle.trim();
  editingTarget = null;
  save(); render();
}

function renameSubtask(projectId, sectionId, subId, newTitle){
  const it = items.find(i => i.id === projectId);
  const s = it && it.sections.find(s => s.id === sectionId);
  const t = s && s.subtasks.find(t => t.id === subId);
  if(t && newTitle.trim()) t.text = newTitle.trim();
  editingTarget = null;
  save(); render();
}

function moveProject(fromIdx, toIdx){
  if(fromIdx === toIdx) return;
  const activeList = items.filter(i => i.status === 'active');
  const doneList = items.filter(i => i.status === 'done');
  const [item] = activeList.splice(fromIdx, 1);
  activeList.splice(toIdx, 0, item);
  items = activeList.concat(doneList);
  save(); render();
}

function moveSection(projectId, fromIdx, toIdx){
  if(fromIdx === toIdx) return;
  const it = items.find(i => i.id === projectId);
  if(!it) return;
  const [item] = it.sections.splice(fromIdx, 1);
  it.sections.splice(toIdx, 0, item);
  save(); render();
}

function moveSubtask(projectId, sectionId, fromIdx, toIdx){
  if(fromIdx === toIdx) return;
  const it = items.find(i => i.id === projectId);
  if(!it) return;
  const s = it.sections.find(s => s.id === sectionId);
  if(!s) return;
  const [item] = s.subtasks.splice(fromIdx, 1);
  s.subtasks.splice(toIdx, 0, item);
  save(); render();
}

// Touch (mobile) drag-and-drop: native HTML5 dragstart/dragover doesn't fire
// reliably on touch devices, so this implements a long-press-to-grab pattern
// using raw touch events. handleEl = element the finger presses on,
// dragEl = element that gets the visual "dragging" dim, selfEl = the item's
// own container (used to skip self as a drop target), matchSelector = CSS
// selector for valid drop targets, sameScope = fn(target)->bool restricting
// drops to the right list (e.g. same project), getFromIndex/onDrop wire it
// to the same move* functions the mouse version uses.
function makeTouchDraggable(handleEl, dragEl, selfEl, matchSelector, sameScope, getFromIndex, onDrop){
  let timer = null, armed = false, startX = 0, startY = 0, overEl = null;

  function clearArm(){
    armed = false;
    if(timer){ clearTimeout(timer); timer = null; }
    dragEl.classList.remove('dragging');
    if(overEl){ overEl.classList.remove('drag-over'); overEl = null; }
  }

  handleEl.addEventListener('touchstart', (e) => {
    if(e.target.closest('input, button, .subtask-check, .color-dot')) return;
    if(e.touches.length !== 1) return;
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    timer = setTimeout(() => {
      armed = true;
      dragEl.classList.add('dragging');
      if(navigator.vibrate) navigator.vibrate(12);
    }, 350);
  }, { passive: true });

  handleEl.addEventListener('touchmove', (e) => {
    if(!timer && !armed) return;
    const t = e.touches[0];
    if(!armed){
      if(Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) clearArm();
      return;
    }
    e.preventDefault();
    if(overEl){ overEl.classList.remove('drag-over'); overEl = null; }
    const el = document.elementFromPoint(t.clientX, t.clientY);
    const target = el && el.closest(matchSelector);
    if(target && target !== selfEl && sameScope(target)){
      target.classList.add('drag-over');
      overEl = target;
    }
  }, { passive: false });

  handleEl.addEventListener('touchend', (e) => {
    if(timer){ clearTimeout(timer); timer = null; }
    if(armed){
      e.preventDefault();
      if(overEl){
        const toIdx = Number(overEl.dataset.index);
        if(!Number.isNaN(toIdx)) onDrop(getFromIndex(), toIdx);
      }
    }
    clearArm();
  });

  handleEl.addEventListener('touchcancel', clearArm);
}

function addSection(projectId, title){
  const it = items.find(i => i.id === projectId);
  if(!it || !title.trim()) return;
  it.sections.push({ id: uid(), title: title.trim(), subtasks: [] });
  save(); render();
}

function deleteSection(projectId, sectionId){
  const it = items.find(i => i.id === projectId);
  if(!it) return;
  it.sections = it.sections.filter(s => s.id !== sectionId);
  save(); render();
}

function addSubtask(projectId, sectionId, text){
  const it = items.find(i => i.id === projectId);
  if(!it || !text.trim()) return;
  const s = it.sections.find(s => s.id === sectionId);
  if(!s) return;
  s.subtasks.push({ id: uid(), text: text.trim(), done: false });
  save(); render();
}

function toggleSubtask(projectId, sectionId, subId){
  const it = items.find(i => i.id === projectId);
  if(!it) return;
  const s = it.sections.find(s => s.id === sectionId);
  if(!s) return;
  const t = s.subtasks.find(t => t.id === subId);
  if(!t) return;
  t.done = !t.done;
  save(); render();
}

function deleteSubtask(projectId, sectionId, subId){
  const it = items.find(i => i.id === projectId);
  if(!it) return;
  const s = it.sections.find(s => s.id === sectionId);
  if(!s) return;
  s.subtasks = s.subtasks.filter(t => t.id !== subId);
  save(); render();
}

function toggleOpen(id){
  if(openIds.has(id)) openIds.delete(id); else openIds.add(id);
  render();
}

function setView(view){
  currentView = view;
  els.statButtons.forEach(b => b.classList.toggle('active', b.dataset.view === view));
  els.viewLabel.textContent = VIEW_LABELS[view];
  els.addProjectSection.style.display = (view === 'active') ? '' : 'none';
  render();
}

function updateStats(){
  const activeItems = items.filter(i => i.status === 'active');
  const doneItems = items.filter(i => i.status === 'done');
  const totalSteps = items.reduce((acc,i)=> acc + allSteps(i).filter(s=>s.done).length, 0);
  const todayCount = activeItems.filter(p => findNextStep(p) !== null).length;
  els.statProjects.textContent = activeItems.length;
  els.statSteps.textContent = totalSteps;
  els.statDone.textContent = doneItems.length;
  els.statToday.textContent = todayCount;
}

function findNextStep(p){
  for(const s of p.sections){
    for(const t of s.subtasks){
      if(!t.done) return { section: s, step: t };
    }
  }
  return null;
}

function renderToday(){
  const activeItems = items.filter(i => i.status === 'active');
  if(activeItems.length === 0){
    els.mainList.innerHTML = '<div class="empty-state">Пока нет активных задач. Добавь первую во вкладке «Проектов».</div>';
    return;
  }
  els.mainList.innerHTML = '';
  activeItems.forEach(p => {
    const next = findNextStep(p);
    const row = document.createElement('div');
    row.className = 'today-item';
    row.style.borderLeftColor = p.color;

    if(next){
      const check = document.createElement('span');
      check.className = 'subtask-check';
      check.addEventListener('click', () => toggleSubtask(p.id, next.section.id, next.step.id));
      row.appendChild(check);

      const body = document.createElement('div');
      body.className = 'today-item-body';
      const title = document.createElement('div');
      title.className = 'today-item-title';
      title.textContent = next.step.text;
      body.appendChild(title);
      const sub = document.createElement('div');
      sub.className = 'today-item-sub';
      sub.textContent = p.title + ' — ' + next.section.title;
      body.appendChild(sub);
      row.appendChild(body);
    } else {
      const steps = allSteps(p);
      const note = document.createElement('div');
      note.className = 'today-note';
      note.textContent = steps.length ? p.title + ' — все шаги выполнены' : p.title + ' — ещё нет шагов';
      row.appendChild(note);

      const btn = document.createElement('button');
      btn.className = 'today-action-btn';
      if(steps.length){
        btn.textContent = '✓ Завершить';
        btn.addEventListener('click', () => finishProject(p.id));
      } else {
        btn.textContent = 'Открыть →';
        btn.addEventListener('click', () => { openIds.add(p.id); setView('active'); });
      }
      row.appendChild(btn);
    }

    els.mainList.appendChild(row);
  });
}

function renderProjects(){
  const activeItems = items.filter(i => i.status === 'active');
  if(activeItems.length === 0){
    els.mainList.innerHTML = '<div class="empty-state">Пока нет задач. Начни с одной — можно самой пугающей.</div>';
    return;
  }
  els.mainList.innerHTML = '';
  activeItems.forEach((p, pIdx) => {
    const pct = progressOf(p);
    const isOpen = openIds.has(p.id);
    const steps = allSteps(p);
    const doneCount = steps.filter(s=>s.done).length;

    const card = document.createElement('div');
    card.className = 'project';
    card.style.borderLeftColor = p.color;
    card.dataset.index = pIdx;
    card.addEventListener('dragover', (e) => {
      if(!dragInfo || dragInfo.kind !== 'project') return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
    card.addEventListener('drop', (e) => {
      e.preventDefault();
      card.classList.remove('drag-over');
      if(!dragInfo || dragInfo.kind !== 'project') return;
      moveProject(dragInfo.fromIndex, pIdx);
    });

    const body = document.createElement('div');
    body.className = 'project-body';

    // top row
    const top = document.createElement('div');
    top.className = 'project-top drag-handle';
    top.draggable = true;
    top.addEventListener('click', () => toggleOpen(p.id));
    top.addEventListener('dragstart', (e) => {
      if(e.target.tagName === 'INPUT'){ e.preventDefault(); return; }
      dragInfo = { kind: 'project', fromIndex: pIdx };
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    top.addEventListener('dragend', () => { card.classList.remove('dragging'); dragInfo = null; });
    makeTouchDraggable(top, card, card, '.project', () => true, () => pIdx, (from, to) => moveProject(from, to));

    const chevron = document.createElement('span');
    chevron.className = 'chevron' + (isOpen ? ' open' : '');
    chevron.textContent = '▸';
    top.appendChild(chevron);

    const title = document.createElement('span');
    title.className = 'project-title';
    title.textContent = p.title;

    if(editingTarget && editingTarget.type === 'project' && editingTarget.id === p.id){
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'inline-edit-input';
      input.value = p.title;
      input.maxLength = 140;
      let committed = false;
      input.addEventListener('click', e => e.stopPropagation());
      input.addEventListener('mousedown', e => e.stopPropagation());
      input.addEventListener('keydown', e => {
        e.stopPropagation();
        if(e.key === 'Enter'){ committed = true; renameProject(p.id, input.value); }
        else if(e.key === 'Escape'){ committed = true; cancelEdit(); }
      });
      input.addEventListener('blur', () => { if(!committed){ committed = true; renameProject(p.id, input.value); } });
      top.appendChild(input);
      requestAnimationFrame(() => { input.focus(); input.select(); });
    } else {
      top.appendChild(title);
      const editBtn = document.createElement('button');
      editBtn.className = 'edit-btn';
      editBtn.title = 'Переименовать';
      editBtn.innerHTML = '✎';
      editBtn.addEventListener('click', (e) => { e.stopPropagation(); startEdit({ type: 'project', id: p.id }); });
      top.appendChild(editBtn);
    }

    if(steps.length){
      const tag = document.createElement('span');
      tag.className = 'progress-tag';
      tag.textContent = doneCount + '/' + steps.length;
      top.appendChild(tag);
    }

    const actions = document.createElement('div');
    actions.className = 'project-actions';

    const finishBtn = document.createElement('button');
    finishBtn.className = 'icon-btn finish';
    finishBtn.title = 'Завершить задачу целиком';
    finishBtn.innerHTML = '✓';
    finishBtn.addEventListener('click', (e) => { e.stopPropagation(); finishProject(p.id); });
    actions.appendChild(finishBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn danger';
    delBtn.title = 'Удалить задачу';
    delBtn.innerHTML = '✕';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      showConfirm('Удалить задачу «' + p.title + '» вместе со всеми разделами и шагами?', 'Удалить').then(ok => {
        if(ok) deleteProject(p.id);
      });
    });
    actions.appendChild(delBtn);

    top.appendChild(actions);
    body.appendChild(top);

    if(editingTarget && editingTarget.type === 'project' && editingTarget.id === p.id){
      const colorRow = document.createElement('div');
      colorRow.className = 'color-edit-row';
      COLORS.forEach(c => {
        const dot = document.createElement('span');
        dot.className = 'color-dot' + (c === p.color ? ' active' : '');
        dot.style.backgroundColor = c;
        dot.addEventListener('click', (e) => { e.stopPropagation(); setProjectColor(p.id, c); });
        colorRow.appendChild(dot);
      });
      body.appendChild(colorRow);
    }

    if(steps.length){
      const bar = document.createElement('div');
      bar.className = 'progress-bar';
      const barFill = document.createElement('div');
      barFill.className = 'progress-bar-fill';
      barFill.style.setProperty('--spine-color', p.color);
      barFill.style.width = pct + '%';
      bar.appendChild(barFill);
      body.appendChild(bar);
    }

    // sections
    const sectionsWrap = document.createElement('div');
    sectionsWrap.className = 'sections-wrap' + (isOpen ? ' open' : '');

    const notesBlock = document.createElement('div');
    notesBlock.className = 'notes-block';
    const notesLabel = document.createElement('div');
    notesLabel.className = 'notes-label';
    notesLabel.textContent = 'Заметки';
    notesBlock.appendChild(notesLabel);
    const notesArea = document.createElement('textarea');
    notesArea.className = 'notes-textarea';
    notesArea.placeholder = 'Мысли, ссылки, идеи по задаче…';
    notesArea.value = p.notes || '';
    notesArea.addEventListener('input', () => updateNotes(p.id, notesArea.value));
    notesArea.addEventListener('mousedown', e => e.stopPropagation());
    notesBlock.appendChild(notesArea);
    sectionsWrap.appendChild(notesBlock);

    if(p.sections.length === 0){
      const empty = document.createElement('div');
      empty.className = 'sections-empty';
      empty.textContent = 'Пока нет разделов. Раздели задачу на части — например «Глава 1», «Черновик», «Правка».';
      sectionsWrap.appendChild(empty);
    }

    p.sections.forEach((s, sIdx) => {
      const sp = sectionProgress(s);
      const block = document.createElement('div');
      block.className = 'section-block';
      block.dataset.index = sIdx;
      block.dataset.projectId = p.id;

      const head = document.createElement('div');
      head.className = 'section-head';
      head.draggable = true;
      head.addEventListener('dragstart', (e) => {
        if(e.target.tagName === 'INPUT'){ e.preventDefault(); return; }
        dragInfo = { kind: 'section', projectId: p.id, fromIndex: sIdx };
        head.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      head.addEventListener('dragend', () => { head.classList.remove('dragging'); dragInfo = null; });
      makeTouchDraggable(head, head, block, '.section-block', (target) => target.dataset.projectId === p.id, () => sIdx, (from, to) => moveSection(p.id, from, to));
      head.addEventListener('dragover', (e) => {
        if(!dragInfo || dragInfo.kind !== 'section' || dragInfo.projectId !== p.id) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        block.classList.add('drag-over');
      });
      head.addEventListener('dragleave', () => block.classList.remove('drag-over'));
      head.addEventListener('drop', (e) => {
        e.preventDefault();
        block.classList.remove('drag-over');
        if(!dragInfo || dragInfo.kind !== 'section' || dragInfo.projectId !== p.id) return;
        moveSection(p.id, dragInfo.fromIndex, sIdx);
      });

      const marker = document.createElement('span');
      marker.className = 'section-marker';
      marker.style.backgroundColor = p.color;
      head.appendChild(marker);

      const sTitle = document.createElement('span');
      sTitle.className = 'section-title';
      sTitle.textContent = s.title;

      if(editingTarget && editingTarget.type === 'section' && editingTarget.projectId === p.id && editingTarget.id === s.id){
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'inline-edit-input';
        input.value = s.title;
        input.maxLength = 100;
        let committed = false;
        input.addEventListener('click', e => e.stopPropagation());
        input.addEventListener('mousedown', e => e.stopPropagation());
        input.addEventListener('keydown', e => {
          e.stopPropagation();
          if(e.key === 'Enter'){ committed = true; renameSection(p.id, s.id, input.value); }
          else if(e.key === 'Escape'){ committed = true; cancelEdit(); }
        });
        input.addEventListener('blur', () => { if(!committed){ committed = true; renameSection(p.id, s.id, input.value); } });
        head.appendChild(input);
        requestAnimationFrame(() => { input.focus(); input.select(); });
      } else {
        head.appendChild(sTitle);
        const sEditBtn = document.createElement('button');
        sEditBtn.className = 'edit-btn';
        sEditBtn.title = 'Переименовать раздел';
        sEditBtn.innerHTML = '✎';
        sEditBtn.addEventListener('click', (e) => { e.stopPropagation(); startEdit({ type: 'section', projectId: p.id, id: s.id }); });
        head.appendChild(sEditBtn);
      }

      if(sp.total){
        const sProg = document.createElement('span');
        sProg.className = 'section-progress';
        sProg.textContent = sp.done + '/' + sp.total;
        head.appendChild(sProg);
      }

      const sDel = document.createElement('button');
      sDel.className = 'section-del';
      sDel.title = 'Удалить раздел';
      sDel.textContent = '✕';
      sDel.addEventListener('click', () => {
        if(!s.subtasks.length){ deleteSection(p.id, s.id); return; }
        showConfirm('Удалить раздел «' + s.title + '» вместе с шагами?', 'Удалить').then(ok => {
          if(ok) deleteSection(p.id, s.id);
        });
      });
      head.appendChild(sDel);

      block.appendChild(head);

      if(s.subtasks.length === 0){
        const se = document.createElement('div');
        se.className = 'section-empty';
        se.textContent = 'Шагов пока нет.';
        block.appendChild(se);
      } else {
        const subWrap = document.createElement('div');
        subWrap.className = 'subtasks';
        s.subtasks.forEach((t, idx) => {
          const row = document.createElement('div');
          row.className = 'subtask';
          row.draggable = true;
          row.dataset.index = idx;
          row.dataset.projectId = p.id;
          row.dataset.sectionId = s.id;
          row.addEventListener('dragstart', (e) => {
            if(e.target.tagName === 'INPUT'){ e.preventDefault(); return; }
            dragInfo = { kind: 'step', projectId: p.id, sectionId: s.id, fromIndex: idx };
            row.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
          });
          row.addEventListener('dragend', () => { row.classList.remove('dragging'); dragInfo = null; });
          makeTouchDraggable(row, row, row, '.subtask', (target) => target.dataset.projectId === p.id && target.dataset.sectionId === s.id, () => idx, (from, to) => moveSubtask(p.id, s.id, from, to));
          row.addEventListener('dragover', (e) => {
            if(!dragInfo || dragInfo.kind !== 'step' || dragInfo.projectId !== p.id || dragInfo.sectionId !== s.id) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            row.classList.add('drag-over');
          });
          row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
          row.addEventListener('drop', (e) => {
            e.preventDefault();
            row.classList.remove('drag-over');
            if(!dragInfo || dragInfo.kind !== 'step' || dragInfo.projectId !== p.id || dragInfo.sectionId !== s.id) return;
            moveSubtask(p.id, s.id, dragInfo.fromIndex, idx);
          });

          const num = document.createElement('span');
          num.className = 'subtask-num';
          num.textContent = (idx+1) + '.';
          row.appendChild(num);

          const check = document.createElement('span');
          check.className = 'subtask-check' + (t.done ? ' checked' : '');
          check.textContent = t.done ? '✓' : '';
          check.addEventListener('click', () => toggleSubtask(p.id, s.id, t.id));
          row.appendChild(check);

          const text = document.createElement('span');
          text.className = 'subtask-text' + (t.done ? ' done' : '');
          text.textContent = t.text;

          if(editingTarget && editingTarget.type === 'subtask' && editingTarget.projectId === p.id && editingTarget.sectionId === s.id && editingTarget.id === t.id){
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'inline-edit-input';
            input.value = t.text;
            input.maxLength = 140;
            let committed = false;
            input.addEventListener('click', e => e.stopPropagation());
            input.addEventListener('mousedown', e => e.stopPropagation());
            input.addEventListener('keydown', e => {
              e.stopPropagation();
              if(e.key === 'Enter'){ committed = true; renameSubtask(p.id, s.id, t.id, input.value); }
              else if(e.key === 'Escape'){ committed = true; cancelEdit(); }
            });
            input.addEventListener('blur', () => { if(!committed){ committed = true; renameSubtask(p.id, s.id, t.id, input.value); } });
            row.appendChild(input);
            requestAnimationFrame(() => { input.focus(); input.select(); });
          } else {
            row.appendChild(text);
            const editBtn = document.createElement('button');
            editBtn.className = 'subtask-edit';
            editBtn.title = 'Переименовать шаг';
            editBtn.innerHTML = '✎';
            editBtn.addEventListener('click', () => startEdit({ type: 'subtask', projectId: p.id, sectionId: s.id, id: t.id }));
            row.appendChild(editBtn);
          }

          const del = document.createElement('button');
          del.className = 'subtask-del';
          del.textContent = '✕';
          del.addEventListener('click', () => deleteSubtask(p.id, s.id, t.id));
          row.appendChild(del);

          subWrap.appendChild(row);
        });
        block.appendChild(subWrap);
      }

      const addRow = document.createElement('div');
      addRow.className = 'add-subtask';
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Добавить шаг в «' + s.title + '»…';
      input.maxLength = 140;
      const addBtn = document.createElement('button');
      addBtn.textContent = '+ Шаг';
      const doAdd = () => { addSubtask(p.id, s.id, input.value); };
      addBtn.addEventListener('click', doAdd);
      input.addEventListener('keydown', (e) => { if(e.key === 'Enter') doAdd(); });
      addRow.appendChild(input);
      addRow.appendChild(addBtn);
      block.appendChild(addRow);

      sectionsWrap.appendChild(block);
    });

    // add section form
    const addSecRow = document.createElement('div');
    addSecRow.className = 'add-section';
    const secInput = document.createElement('input');
    secInput.type = 'text';
    secInput.placeholder = 'Новый раздел, например «Глава 2»…';
    secInput.maxLength = 100;
    const secBtn = document.createElement('button');
    secBtn.textContent = '+ Раздел';
    const doAddSec = () => { addSection(p.id, secInput.value); secInput.value = ''; };
    secBtn.addEventListener('click', doAddSec);
    secInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') doAddSec(); });
    addSecRow.appendChild(secInput);
    addSecRow.appendChild(secBtn);
    sectionsWrap.appendChild(addSecRow);

    body.appendChild(sectionsWrap);
    card.appendChild(body);
    els.mainList.appendChild(card);
  });
}

function renderStepsView(){
  // собираем выполненные шаги из всех задач (активных и завершённых), по разделам
  const groups = [];
  items.forEach(it => {
    it.sections.forEach(s => {
      const done = s.subtasks.filter(t => t.done);
      if(done.length) groups.push({
        title: it.title, sub: s.title, color: it.color, steps: done,
        projectId: it.id, sectionId: s.id, editable: it.status === 'active'
      });
    });
  });

  if(groups.length === 0){
    els.mainList.innerHTML = '<div class="empty-state">Пока нет отмеченных шагов. Открой задачу в «В планах» и отметь первый шаг.</div>';
    return;
  }

  els.mainList.innerHTML = '';
  groups.forEach(g => {
    const wrap = document.createElement('div');
    wrap.className = 'steps-group';

    const head = document.createElement('div');
    head.className = 'steps-group-title';
    const dot = document.createElement('span');
    dot.className = 'steps-group-dot';
    dot.style.backgroundColor = g.color;
    head.appendChild(dot);
    const t = document.createElement('span');
    t.textContent = g.title;
    head.appendChild(t);
    const sub = document.createElement('span');
    sub.className = 'sub';
    sub.textContent = '— ' + g.sub;
    head.appendChild(sub);
    wrap.appendChild(head);

    g.steps.forEach(s => {
      const row = document.createElement('div');
      row.className = 'subtask';

      const check = document.createElement('span');
      check.className = 'subtask-check checked';
      check.textContent = '✓';
      if(g.editable){
        check.style.cursor = 'pointer';
        check.addEventListener('click', () => toggleSubtask(g.projectId, g.sectionId, s.id));
      } else {
        check.style.cursor = 'default';
      }
      row.appendChild(check);

      const text = document.createElement('span');
      text.className = 'subtask-text done';
      text.textContent = s.text;
      row.appendChild(text);

      wrap.appendChild(row);
    });

    els.mainList.appendChild(wrap);
  });
}

function renderArchive(){
  const doneItems = items.filter(i => i.status === 'done');
  if(doneItems.length === 0){
    els.mainList.innerHTML = '<div class="empty-state">Архив пуст. Заверши первую задачу целиком, чтобы она попала сюда.</div>';
    return;
  }
  els.mainList.innerHTML = '';
  doneItems.forEach(it => {
    const steps = allSteps(it);
    const doneCount = steps.filter(s=>s.done).length;

    const item = document.createElement('div');
    item.className = 'archive-item';
    item.style.borderLeftColor = it.color;

    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = it.title;
    item.appendChild(title);

    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = (steps.length ? doneCount + '/' + steps.length + ' · ' : '') + (it.doneDate || '');
    item.appendChild(meta);

    const restoreBtn = document.createElement('button');
    restoreBtn.className = 'icon-btn restore';
    restoreBtn.title = 'Вернуть в работу';
    restoreBtn.innerHTML = '↺';
    restoreBtn.addEventListener('click', () => restoreProject(it.id));
    item.appendChild(restoreBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn danger';
    delBtn.title = 'Удалить безвозвратно';
    delBtn.innerHTML = '✕';
    delBtn.addEventListener('click', () => deleteArchiveItem(it.id));
    item.appendChild(delBtn);

    els.mainList.appendChild(item);
  });
}

function render(){
  if(currentView === 'active') renderProjects();
  else if(currentView === 'today') renderToday();
  else if(currentView === 'steps') renderStepsView();
  else renderArchive();
  updateStats();
  const doneCount = items.filter(i => i.status === 'done').length;
  els.clearArchiveWrap.style.display = (currentView === 'archive' && doneCount) ? '' : 'none';
}

function clearArchive(){
  const doneCount = items.filter(i => i.status === 'done').length;
  if(!doneCount) return;
  showConfirm('Очистить архив завершённых задач?', 'Очистить').then(ok => {
    if(ok){
      items = items.filter(i => i.status !== 'done');
      save(); render();
    }
  });
}

function exportBackup(){
  const payload = {
    app: 'writer-tracker',
    version: 2,
    exportedAt: new Date().toISOString(),
    items: items
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'tracker-backup-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importBackupFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); }
    catch(e){ showAlert('Не удалось прочитать файл — это точно бэкап трекера в формате JSON?'); return; }

    let newItems = null;
    if(data && Array.isArray(data.items)){
      newItems = data.items.map(r => normalizeItem(r, r.status || 'active'));
    } else if(data && Array.isArray(data.projects) && Array.isArray(data.archive)){
      newItems = data.projects.map(r => normalizeItem(r, 'active'))
        .concat(data.archive.map(r => normalizeItem(r, 'done')));
    } else {
      showAlert('Файл не похож на бэкап трекера.');
      return;
    }

    const finishImport = () => {
      items = newItems;
      openIds = new Set();
      save();
      setView('active');
      showAlert('Бэкап загружен.');
    };

    if(items.length){
      showConfirm('Загрузка бэкапа заменит текущие данные (' + items.length + ' задач всего). Продолжить?', 'Заменить').then(ok => {
        if(ok) finishImport();
      });
    } else {
      finishImport();
    }
  };
  reader.onerror = () => showAlert('Не удалось прочитать файл.');
  reader.readAsText(file);
}

els.addProjectBtn.addEventListener('click', addProject);
els.projectInput.addEventListener('keydown', e => { if(e.key === 'Enter') addProject(); });
els.clearArchiveBtn.addEventListener('click', clearArchive);
els.statButtons.forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
els.exportBtn.addEventListener('click', exportBackup);
els.importBtn.addEventListener('click', () => els.importFile.click());
els.importFile.addEventListener('change', (e) => {
  const file = e.target.files[0];
  importBackupFile(file);
  els.importFile.value = '';
});

function openSettings(){ els.settingsOverlay.classList.add('open'); }
function closeSettings(){ els.settingsOverlay.classList.remove('open'); }
els.settingsBtn.addEventListener('click', openSettings);
els.settingsClose.addEventListener('click', closeSettings);
els.settingsOverlay.addEventListener('click', (e) => { if(e.target === els.settingsOverlay) closeSettings(); });

els.quickColorsClose.addEventListener('click', closeQuickColors);
els.quickColorsOverlay.addEventListener('click', (e) => { if(e.target === els.quickColorsOverlay) closeQuickColors(); });

els.confirmOkBtn.addEventListener('click', () => resolveConfirm(true));
els.confirmCancelBtn.addEventListener('click', () => resolveConfirm(false));
els.confirmOverlay.addEventListener('click', (e) => { if(e.target === els.confirmOverlay) resolveConfirm(false); });

document.addEventListener('keydown', (e) => {
  if(e.key !== 'Escape') return;
  if(els.confirmOverlay.classList.contains('open')) resolveConfirm(false);
  else if(els.quickColorsOverlay.classList.contains('open')) closeQuickColors();
  else if(els.settingsOverlay.classList.contains('open')) closeSettings();
});

loadFavoriteColors();
selectedColor = favoriteColors[0];
initColorPicker();
load();
setView('today');

})();
